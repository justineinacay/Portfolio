<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E1117"><title>The Collectives | Interactive Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 85%,#142942 0%,#0e1117 58%,#080b12 100%);color:#f3f6ff;font:500 15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:360px;text-align:center}.orbits{position:relative;width:90px;height:90px;margin:0 auto 25px}.orbit{position:absolute;left:28px;top:28px;width:55px;height:55px;border:5px solid;border-radius:50%;animation:orbit 3.2s ease-in-out infinite alternate}.a{border-color:#4f76ff;transform:translate(-17px,-17px)}.b{border-color:#44c6ad;transform:translate(12px,-17px);animation-delay:.4s}.c{border-color:#e8b950;transform:translate(0,9px);animation-delay:.8s}@keyframes orbit{to{transform:translate(0,0) rotate(30deg)}}h1{font-size:20px;letter-spacing:.09em;margin:0 0 6px;font-weight:750}p{color:#aab3c4;margin:0 0 23px}.track{height:3px;border-radius:3px;background:#ffffff21;overflow:hidden}.bar{width:0%;height:100%;background:linear-gradient(90deg,#4f76ff,#42cbb3,#e8b950);transition:width .25s}.detail{font-size:12px;margin-top:12px;color:#8e9cb1}button{background:#4f76ff;border:0;border-radius:99px;color:white;padding:12px 21px;font-weight:700;cursor:pointer;display:none;margin:18px auto 0}@media(prefers-reduced-motion:reduce){.orbit{animation:none}.bar{transition:none}}</style></head>
<body><main class="shell"><div class="orbits" aria-hidden="true"><span class="orbit a"></span><span class="orbit b"></span><span class="orbit c"></span></div><h1>THE COLLECTIVES</h1><p>Preparing your interactive experience</p><div class="track" role="progressbar" aria-label="Loading website" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><div class="bar" id="bar"></div></div><div class="detail" id="detail" aria-live="polite">Connecting to preview…</div><button id="retry">Try again</button></main>
<script>
(()=>{const COUNT=30,LENGTH=5318980,PATH="parts/";const detail=document.querySelector("#detail"),bar=document.querySelector("#bar"),track=document.querySelector("#track"),retry=document.querySelector("#retry");
async function load(){retry.style.display="none";detail.textContent="Loading page assets…";let complete=0;try{const parts=new Array(COUNT);let next=0;async function worker(){while(next<COUNT){const i=next++;const url=PATH+String(i).padStart(3,"0")+".txt";const res=await fetch(url,{cache:"force-cache"});if(!res.ok)throw Error("Asset "+i+" returned "+res.status);parts[i]=await res.text();complete++;let percent=Math.round(100*complete/COUNT);bar.style.width=percent+"%";track.setAttribute("aria-valuenow",String(percent));detail.textContent="Loading "+percent+"%";}}await Promise.all(Array.from({length:6},worker));const full=parts.join("");if(full.length!==LENGTH||!full.startsWith("<!doctype html>")||!full.trim().endsWith("</html>"))throw Error("Incomplete website assets. Reload to try again.");document.open();document.write(full);document.close();}catch(e){detail.textContent=e.message+" — please retry.";retry.style.display="block";console.error("Collectives preview:",e);}}retry.addEventListener("click",load);load();})();
</script></body></html>
